name: terraform

# PR touching terraform/  -> fmt, validate, plan (read-only role), plan shown in the run summary
# merge to main           -> plan again + apply (admin role, behind the "production" environment)
on:
  pull_request:
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  workflow_dispatch: {}

# Never two Terraform runs at once (the S3 lock would block the second anyway)
concurrency:
  group: terraform
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  TF_STATE_BUCKET: pcforge-tfstate-833167447551
  TF_IN_AUTOMATION: "true"

defaults:
  run:
    working-directory: terraform

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.0   # same version as the runner VM

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::833167447551:role/pcforge-tf-plan
          aws-region: ${{ env.AWS_REGION }}

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: Validate
        run: terraform validate -no-color

      - name: Plan
        run: |
          terraform plan -input=false -no-color -out=tfplan | tee plan.txt
          {
            echo "### Terraform plan"
            echo '```'
            grep -E '^(Plan:|No changes|  # )' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production   # OIDC subject becomes ...:environment:production; can require approval
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.0

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::833167447551:role/pcforge-tf-apply
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        run: terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}"

      # Re-plan against current state: the PR plan may be stale if main moved since
      - name: Plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Apply
        run: terraform apply -input=false -no-color tfplan
