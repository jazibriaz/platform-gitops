apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pcforge-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io     # deleting the app deletes the Ingress, so the ALB goes too
spec:
  project: default
  source:
    repoURL: https://github.com/jazibriaz/pcforge.git
    targetRevision: main
    path: charts/pcforge
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: pcforge-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
