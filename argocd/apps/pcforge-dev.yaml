apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pcforge-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # deleting the app also deletes what it deployed
spec:
  project: default
  source:
    repoURL: https://github.com/jazibriaz/pcforge.git
    targetRevision: main
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: pcforge-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
